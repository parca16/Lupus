app = "lupus-server"
primary_region = "mad"

[build]

[env]
  LUPUS_RATE_MAX_MESSAGES = "60"
  LUPUS_RATE_WINDOW_MILLIS = "10000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
