spring.application.name=lupus
# Render inyecta PORT; en local se mantiene 8080.
server.port=${PORT:8080}

# Endpoint de salud: http://localhost:8080/actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Limite de mensajes por conexion (issue #74).
lupus.rate.max-messages=60
lupus.rate.window-millis=10000

logging.level.com.parca16.lupus=INFO
